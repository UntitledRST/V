<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RC8 일감 현황</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0a0e14;
    --panel-bg: #10161f;
    --panel-border: #1e2733;
    --card-bg: #131a24;
    --text-primary: #eef2f7;
    --text-secondary: #93a1b3;
    --text-tertiary: #5b6b80;
    --blue: #5b9dff;
    --purple: #c084fc;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #ef4444;
    --orange: #fb923c;
    --radius-lg: 14px;
    --radius-md: 10px;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Pretendard, sans-serif;
  }
  *{ box-sizing:border-box; }
  html, body{
    margin:0; padding:0; background:var(--bg); color:var(--text-primary);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
    overflow-x:hidden; height:100%;
  }
  .wrap{
    width:100%; margin:0; padding:8px 20px 8px;
    height:100vh; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden;
  }
  #errorBox{ flex:0 0 auto; }
  .issues-panel{ flex:0 0 auto; }

  #errorBox:empty{ display:none; }
  .last-updated{ margin:0; font-size:13px; font-weight:400; color:var(--text-secondary); }
  .last-updated span{ color:var(--green); font-family:var(--mono); }

  .page-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:8px; align-items:stretch;
    flex:1 1 auto; min-height:0;
  }
  .main-grid{
    overflow:auto; min-height:0;
    display:flex; flex-direction:column; gap:8px; min-width:0; height:100%;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--radius-lg);
    padding:10px 14px;
  }
  .right-col{ display:flex; flex-direction:column; gap:8px; min-width:0; height:100%; min-height:0; overflow:hidden; }
  .assignee-sidebar{ display:flex; flex-direction:column; min-height:0; height:100%; position:relative; }
  .assignee-scroll{ flex:1; overflow:auto; min-height:0; }

  .author-sidebar{ display:flex; flex-direction:column; min-height:0; height:100%; position:relative; }
  .author-scroll{ flex:1; overflow:auto; min-height:0; }
  .dashboard-grid:not(.no-author) .assignee-scroll{ max-height:26vh; }
  .dashboard-grid:not(.no-author) .author-scroll{ max-height:20vh; }

  .feedback-panel{ display:flex; flex-direction:column; min-height:0; height:100%; overflow:hidden; }
  .feedback-panel > table{ flex:0 0 auto; font-size:19px; }
  .feedback-team-row td{ cursor:pointer; padding:8px 10px; }
  .feedback-team-row.active td{ background:rgba(91,157,255,0.14); }
  .feedback-detail{ margin-top:6px; overflow-y:auto; overflow-x:hidden; flex:1 1 auto; min-height:0; overscroll-behavior:contain; }
  .feedback-detail-title{ font-size:24px; font-weight:800; margin:8px 0 12px; color:var(--text-primary); text-align:center; }
  .feedback-section{ margin-bottom:18px; }
  .feedback-section-title{ font-size:19px; font-weight:700; color:var(--text-secondary); margin:10px 0 6px; }
  .feedback-detail table{ font-size:18px; table-layout:fixed; }
  .feedback-detail th:nth-child(1), .feedback-detail td:nth-child(1){ width:86px; }
  .feedback-detail th:nth-child(2), .feedback-detail td:nth-child(2){ width:88px; }
  .feedback-detail td{ vertical-align:top; word-break:break-all; overflow-wrap:anywhere; padding:9px 9px; max-width:0; }
  .feedback-empty-hint{ color:var(--text-tertiary); font-size:16px; text-align:center; padding:16px 8px; }

  .dashboard-grid{
    display:grid;
    grid-template-columns: 1fr 1fr 1.3fr;
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "status  part     assignee"
      "status  conn     author"
      "chart   chart    chart";
    gap:8px;
  }
  .dashboard-grid.no-author{
    grid-template-areas:
      "status  part     assignee"
      "status  conn     assignee"
      "chart   chart    chart";
  }
  .grid-assignee{ grid-area: assignee; min-width:0; }
  .grid-author{ grid-area: author; min-width:0; }
  .grid-status{ grid-area: status; min-width:0; }
  .grid-part{ grid-area: part; min-width:0; }
  .grid-conn{ grid-area: conn; min-width:0; }
  .grid-chart{ grid-area: chart; }

  .stat-card.total-banner-card{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:2px 16px; min-height:0; height:26px;
  }
  .banner-item{ display:flex; align-items:center; gap:6px; cursor:pointer; }
  .banner-divider{ width:1px; height:16px; background:var(--panel-border); }
  .total-banner-card .label{ font-size:12px; color:var(--text-secondary); }
  .total-banner-card .value{ font-size:15px; font-weight:800; font-family:var(--mono); color:var(--text-primary); }
  .total-banner-card .rate-badge{ font-size:11px; padding:1px 6px; border-radius:6px; }

  .stat-row{ display:grid; grid-template-columns: 0.6fr 0.5fr 1.2fr 0.5fr 3.2fr; gap:14px; }
  .stat-card{
    background:var(--card-bg); border:1px solid var(--panel-border); border-radius:var(--radius-md);
    padding:6px 16px; display:flex; flex-direction:column; justify-content:center;
  }
  .stat-card.clickable{ cursor:pointer; transition: transform .12s ease, border-color .12s ease; }
  .stat-card.clickable:hover{ transform: translateY(-2px); border-color: var(--blue); }
  .stat-card .label{ font-size:16px; color:var(--text-secondary); margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .stat-card .value{ font-size:46px; font-weight:800; font-family:var(--mono); }
  .stat-card.notdone .value{ color:var(--yellow); }
  .stat-card.done .value{ color:var(--green); }
  .stat-card.rate .value{ color:var(--blue); }
  .stat-card.done, .stat-card.rate{ align-items:center; text-align:center; }

  .issues-panel{ display:flex; flex-direction:column; position:relative; }
  .issues-panel .issues-table-scroll{ max-height:19vh; overflow:auto; }

  .panels{ display:grid; grid-template-columns: 0.6fr 1fr 1fr 2.4fr; gap:14px; }
  .panels .panel{ display:flex; flex-direction:column; overflow:visible; }

  .chart-panel{ display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .chart-wrap{ position:relative; height:170px; overflow:hidden; min-width:0; }
  .chart-wrap canvas{ max-width:100%; }

  .chart-tooltip{
    position:fixed; z-index:99999; pointer-events:none;
    background:#161b26; border:1px solid rgba(255,255,255,0.1); border-radius:10px;
    padding:8px; font-size:13px; color:#e6e9ef; opacity:0; transition:opacity 0.1s ease;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); min-width:150px; max-width:min(360px, 92vw);
    left:0; top:0;
  }
  th.sortable{ cursor:pointer; user-select:none; white-space:nowrap; }
  th.sortable:hover{ color:#fff; }
  th.sortable .sort-arrow{ margin-left:4px; font-size:11px; opacity:0.45; }
  th.sortable.active .sort-arrow{ opacity:1; color:var(--blue); }

  .chart-tooltip-title{ font-weight:700; font-size:13.5px; padding:2px 6px 6px; color:#fff; }
  .chart-tooltip-row{ display:flex; justify-content:space-between; gap:14px; padding:6px 8px; border-radius:6px; cursor:pointer; }
  .chart-tooltip-row:hover{ background:rgba(91,157,255,0.16); }
  .chart-tooltip-row .chart-tooltip-value{ color:#93a1b3; font-weight:600; }
  .chart-tooltip-row:hover .chart-tooltip-value{ color:#fff; }

  @media (max-height: 800px){
    .issues-panel .issues-table-scroll{ max-height:16vh; }
    .chart-wrap{ height:120px; }
    .dashboard-grid{ gap:6px; }
    .panel{ padding:8px 12px; }
    .panel h2{ margin-bottom:4px; font-size:17px; }
    .dashboard-grid:not(.no-author) .assignee-scroll{ max-height:22vh; }
    .dashboard-grid:not(.no-author) .author-scroll{ max-height:17vh; }
  }
  @media (max-height: 650px){
    .issues-panel .issues-table-scroll{ max-height:13vh; }
    .chart-wrap{ height:90px; }
    .dashboard-grid:not(.no-author) .assignee-scroll{ max-height:19vh; }
    .dashboard-grid:not(.no-author) .author-scroll{ max-height:15vh; }
  }

  @media (max-width: 1100px){
    .panels{ grid-template-columns: repeat(2, 1fr); }
    .dashboard-grid{
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "status  part"
        "status  conn"
        "assignee assignee"
        "author  author"
        "chart   chart";
    }
    .dashboard-grid.no-author{
      grid-template-areas:
        "status  part"
        "status  conn"
        "assignee assignee"
        "chart   chart";
    }
  }

  .panel{
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:var(--radius-lg);
    padding:10px 14px;
  }
  .panel h2{ margin:0 0 6px; font-size:19px; font-weight:800; letter-spacing:0.01em; flex:0 0 auto; text-align:center; }
  .panel h2.c-blue{ color:var(--blue); }
  .panel h2.c-purple{ color:var(--purple); }
  .panel h2.c-orange{ color:var(--orange); }
  .panel h2.c-green{ color:var(--green); }

  table{ width:100%; border-collapse:collapse; font-size:15px; }
  .dashboard-grid .panel table{ font-size:13px; }
  .dashboard-grid .panel th{ font-size:11.5px; padding:3px 6px; }
  .dashboard-grid .panel td{ padding:3px 6px; }
  th{ text-align:left; color:var(--text-secondary); font-weight:600; font-size:13px; text-transform:uppercase; letter-spacing:0.03em; padding:4px 8px; border-bottom:1px solid var(--panel-border); }
  td{ padding:5px 9px; border-bottom:1px solid rgba(255,255,255,0.04); white-space:nowrap; }
  td.title-cell{ white-space:normal; }
  tr.total-row td{ font-weight:800; color:var(--text-primary); border-top:1px solid var(--panel-border); }
  tr.clickable{ cursor:pointer; }
  tr.clickable:hover td{ background:rgba(91,157,255,0.07); }
  .pill{ display:inline-block; padding:3px 11px; border-radius:999px; font-size:14px; font-weight:700; }
  .mono{ font-family:var(--mono); }
  .num{ text-align:right; font-family:var(--mono); }

  .issues-panel h2{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .issues-panel h2 .issues-title{ flex:1; text-align:center; }
  .issues-mini-stats{ display:flex; align-items:center; gap:8px; }

  .squad-picker{ display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .squad-picker-label{ font-size:12px; font-weight:700; color:var(--text-tertiary); letter-spacing:0.04em; text-transform:uppercase; }
  .squad-select{
    background:var(--card-bg); color:var(--text-primary);
    border:1px solid var(--panel-border); border-radius:999px;
    font-family:var(--sans); font-size:13px; font-weight:700;
    padding:4px 30px 4px 12px; cursor:pointer; outline:none;
    -webkit-appearance:none; appearance:none;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath d='M2 4.5 6 8.5 10 4.5' fill='none' stroke='%235b9dff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 10px center; background-size:11px;
    transition: border-color .12s ease, color .12s ease;
  }
  .squad-select:hover, .squad-select:focus{ border-color:var(--blue); color:var(--blue); }
  .squad-select:disabled{ opacity:0.55; cursor:progress; }
  .squad-select option{ background:var(--card-bg); color:var(--text-primary); font-weight:600; }
  .mini-stat{
    font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px;
    background:rgba(255,255,255,0.04); border:1px solid var(--panel-border); white-space:nowrap;
  }
  .mini-stat.rate-badge{ color:var(--blue); }
  .mini-stat.mini-clickable{ cursor:pointer; color:var(--yellow); transition: transform .12s ease, border-color .12s ease; }
  .mini-stat.mini-clickable:hover{ transform:translateY(-1px); border-color:var(--blue); }

  .filter-chip{
    display:none; align-items:center; gap:6px; background:rgba(91,157,255,0.14); color:var(--blue);
    font-size:14.5px; font-weight:700; padding:5px 12px; border-radius:999px; cursor:pointer;
  }
  .filter-chip.active{ display:inline-flex; }
  .filter-chip .x{ font-weight:900; }

  .expand-handle{
    position:absolute; left:50%; bottom:-14px; transform:translateX(-50%);
    width:56px; height:26px; display:flex; align-items:center; justify-content:center;
    background:var(--panel-bg); border:1px solid var(--panel-border); border-radius:999px;
    color:var(--text-secondary); cursor:ns-resize; z-index:5; font-size:14px;
    transition: border-color .12s ease, color .12s ease;
    touch-action:none;
  }
  .expand-handle:hover{ border-color:var(--blue); color:var(--blue); }

  .hidden-nav-btn{
    position:fixed; top:0; right:0; width:64px; height:64px; z-index:999;
    background:transparent; border:none; padding:0; margin:0; cursor:pointer;
  }

  .issues-table-scroll{ overflow:auto; }
  .issues-table-scroll table{ font-size:16px; }
  .issues-table-scroll th{ position:sticky; top:0; background:var(--panel-bg); }
  .status-badge{ font-size:13px; font-weight:700; padding:3px 9px; border-radius:6px; white-space:nowrap; }
  .status-badge.notdone{ background:rgba(251,191,36,0.15); color:var(--yellow); }
  .status-badge.done{ background:rgba(255,255,255,0.06); color:var(--text-tertiary); }
  a.issue-link{ color:var(--blue); text-decoration:none; font-family:var(--mono); }
  a.issue-link:hover{ text-decoration:underline; }
  .title-cell{ max-width:900px; }
  a.title-link{ color:var(--text-primary); text-decoration:none; }
  a.title-link:hover{ color:var(--blue); text-decoration:underline; }

  .empty, .loading{ color:var(--text-tertiary); font-size:15px; padding:20px 0; text-align:center; }
  .error-box{
    background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#fca5a5;
    padding:10px 14px; border-radius:var(--radius-md); font-size:15px; margin-bottom:10px;
  }
</style>
</head>
<body>
<button id="hiddenNavBtn" class="hidden-nav-btn" type="button" aria-hidden="true" tabindex="-1"></button>
<div class="wrap">

  <div id="errorBox"></div>

  <div class="panel issues-panel">
    <h2>
      <span class="issues-title">전체 이슈 목록 (<span id="issueCount">0</span>건)</span>
      <span class="squad-picker">
        <span class="squad-picker-label">Squad</span>
        <select id="squadSelect" class="squad-select" aria-label="스쿼드 선택"></select>
      </span>
      <span class="issues-mini-stats">
        <span class="mini-stat rate-badge" id="headerRateBadge">완료율 &mdash;</span>
        <span class="mini-stat mini-clickable" id="headerHighCard">우선순위 높음 <span id="headerHighValue">&mdash;</span>건</span>
        <span class="mini-stat mini-clickable" id="headerNotdoneCard">미처리 <span id="headerNotdoneValue">&mdash;</span>건</span>
        <span class="mini-stat mini-clickable" id="headerTodayNewCard">금일 등록 <span id="headerTodayNewValue">&mdash;</span>건</span>
      </span>
      <span class="filter-chip" id="filterChip"><span id="filterLabel"></span><span class="x">&times;</span></span>
      <span id="lastUpdated" class="last-updated">불러오는 중&hellip;</span>
    </h2>
    <div class="issues-table-scroll" id="issuesTableScroll">
      <table>
        <thead>
          <tr>
            <th style="width:44px">번호</th>
            <th style="width:80px">일감번호</th>
            <th>분류</th>
            <th>상태</th>
            <th>제목</th>
            <th>우선순위</th>
            <th>담당자</th>
            <th id="sortCreatedTh" class="sortable" title="클릭하면 작성시간 오름차순/내림차순이 전환됩니다">작성시간<span class="sort-arrow" id="sortCreatedArrow">&#8597;</span></th>
          </tr>
        </thead>
        <tbody id="issuesBody"><tr><td colspan="8" class="loading">불러오는 중&hellip;</td></tr></tbody>
      </table>
    </div>
    <button type="button" id="expandIssuesBtn" class="expand-handle" aria-label="드래그해서 전체 이슈 목록 높이 조절">
      <span id="expandIssuesArrow">&#8597;</span>
    </button>
  </div>

  <div class="page-grid">
  <div class="main-grid">

  <div class="dashboard-grid" id="statRow">

    <div class="panel assignee-sidebar grid-assignee">
      <h2 class="c-blue">담당자별</h2>
      <div class="assignee-scroll">
        <table>
          <thead><tr><th>담당자</th><th>할당/처리</th><th style="text-align:right">처리율</th></tr></thead>
          <tbody id="assigneeBody"><tr><td colspan="4" class="loading">불러오는 중&hellip;</td></tr></tbody>
        </table>
      </div>
      <div class="chart-tooltip" id="assigneeTooltip"></div>
    </div>

    <div class="panel author-sidebar grid-author" id="authorPanel">
      <h2 class="c-green">작성자별</h2>
      <div class="author-scroll">
        <table>
          <thead><tr><th>작성자</th><th>등록/완료</th><th style="text-align:right">완료율</th></tr></thead>
          <tbody id="authorBody"><tr><td colspan="3" class="loading">불러오는 중&hellip;</td></tr></tbody>
        </table>
      </div>
      <div class="chart-tooltip" id="authorTooltip"></div>
    </div>

    <div class="panel grid-status">
      <h2 class="c-orange">상태별</h2>
      <table>
        <thead><tr><th>상태</th><th style="text-align:right">개수</th></tr></thead>
        <tbody id="statusBody"><tr><td colspan="2" class="loading">불러오는 중&hellip;</td></tr></tbody>
      </table>
    </div>

    <div class="panel grid-part">
      <h2 class="c-blue">파트별</h2>
      <table>
        <thead><tr><th>파트</th><th style="text-align:right">진행중</th><th style="text-align:right">완료됨</th><th style="text-align:right">합계</th></tr></thead>
        <tbody id="partBody"><tr><td colspan="4" class="loading">불러오는 중&hellip;</td></tr></tbody>
      </table>
    </div>

    <div class="panel grid-conn">
      <h2 class="c-purple">접속유형별</h2>
      <table>
        <thead><tr><th>접속유형</th><th style="text-align:right">진행중</th><th style="text-align:right">완료됨</th><th style="text-align:right">합계</th></tr></thead>
        <tbody id="connTypeBody"><tr><td colspan="4" class="loading">불러오는 중&hellip;</td></tr></tbody>
      </table>
    </div>

    <div class="panel chart-panel grid-chart">
      <h2 class="c-blue">누적 이슈 / 해결 추이</h2>
      <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
    </div>

  </div>

  </div>

  <div class="right-col">

  <div class="panel feedback-panel">
    <h2 class="c-orange">피드백 (<span id="feedbackTotalCount">0</span>건)</h2>
    <table>
      <thead><tr><th>담당주체</th><th style="text-align:right">건수</th><th style="text-align:right">비중</th></tr></thead>
      <tbody id="feedbackTeamBody"></tbody>
    </table>
    <div id="feedbackDetailArea" class="feedback-detail">
      <div class="feedback-empty-hint">담당주체를 클릭하면 세부 내용이 표시됩니다</div>
    </div>
  </div>

  </div>
  </div>
</div>

<script>
  var state = { issues: [], summary: null, filter: null, feedbackItems: [], squad: null, sortDir: null };
  var chart = null;

  var DEFAULT_DESC_SORT_SQUADS = ['275677'];

  function defaultSortDirFor(squadId){
    return DEFAULT_DESC_SORT_SQUADS.indexOf(String(squadId)) !== -1 ? 'desc' : null;
  }

  // ====== 스쿼드 목록 ======
  var SQUADS = [
    { id: 'admin802', label: 'Admin_8.0.2' },
    { id: 'saas802', label: 'SaaS 8.0.2 QA' },
    { id: 'latest', label: 'SaaS 8.0.1 QA' },
    { id: '275677', label: 'Squad1_275677' }
  ];

  // ====== 기본 스쿼드 ======
  var DEFAULT_SQUAD = 'admin802';

  // ====== 작성자별 패널 제외 스쿼드 목록 ======
  var AUTHOR_PANEL_EXCLUDE_SQUADS = ['latest', 'saas802', 'admin802'];

  function isAuthorPanelEnabled(){
    return AUTHOR_PANEL_EXCLUDE_SQUADS.indexOf(String(state.squad)) === -1;
  }

  function findSquad(id){
    return SQUADS.filter(function(s){ return String(s.id) === String(id); })[0] || null;
  }

  var SQUAD_STORAGE_KEY = 'rc8qa.lastSquad';
  function readSavedSquad(){
    try { return localStorage.getItem(SQUAD_STORAGE_KEY); } catch (e) { return null; }
  }
  function saveSquad(id){

  function parseTags(title){
    var tags = [];
    var re = /\[([^\[\]]+)\]/g;
    var m;
    while ((m = re.exec(title || '')) !== null){
      tags.push(m[1].trim());
    }
    return tags;
  }

  function hasIStartWord(text){
    var tokens = String(text || '').split(/[\s\[\]\(\)\u2014\-:,./]+/);
    return tokens.some(function(tok){
      if (!tok) return false;
      if (tok.indexOf('아이폰') !== -1 || tok.indexOf('아이패드') !== -1) return true;
      return /^i/i.test(tok);
    });
  }

  function matchesKeywordList(text, list){
    if (!text) return false;
    var lower = String(text).toLowerCase();
    return list.some(function(k){ return lower.indexOf(String(k).toLowerCase()) !== -1; });
  }

  function matchCategoryFromText(text, keywordMap, checkOrder){
    if (!text) return null;
    var lower = String(text).toLowerCase();
    var keys = checkOrder || Object.keys(keywordMap);
    for (var i = 0; i < keys.length; i++){
      var label = keys[i];
      var kws = keywordMap[label] || [];
      for (var j = 0; j < kws.length; j++){
        if (lower.indexOf(String(kws[j]).toLowerCase()) !== -1) return label;
      }
    }
    return null;
  }

  function classifyIssues(issues){
    issues.forEach(function(it){
      var allTags = parseTags(it.제목);
      var tags = allTags.slice(1);
      var tagText = tags.join(' ');
      var title = it.제목 || '';

      if (matchesKeywordList(title, CLASSIFY_RULES.part.planningKeywords)) {
        it.__part = '기획';
      } else if (matchesKeywordList(title, CLASSIFY_RULES.part.designKeywords)) {
        it.__part = '디자인';
      } else {
        it.__part = '개발';
      }

      if (SQUAD_CONN_RULES[state.squad]) {
        var sr = SQUAD_CONN_RULES[state.squad];
        it.__connType = matchCategoryFromText(title, sr.keywords, sr.checkOrder) || '기타';
      } else {
        it.__connType =
          matchCategoryFromText(tagText, CLASSIFY_RULES.connType.keywords, CLASSIFY_RULES.connType.checkOrder) ||
          matchCategoryFromText(title, CLASSIFY_RULES.connType.keywords, CLASSIFY_RULES.connType.checkOrder) ||
          '기타';

        if (it.__connType === '뷰어 응용') {
          it.__connType = '뷰어';
        }

        if (it.__connType === '기타') {
          if (matchesKeywordList(title, ['중계', 'm1', 'm4'])) {
            it.__connType = '호스트';
          } else if (matchesKeywordList(title, ['어드민', '파트너', '네트워크 그룹'])) {
            it.__connType = '에이전트';
          } else {
            it.__connType = '뷰어';
          }
        }
      }

      it.__env =
        matchCategoryFromText(tagText, CLASSIFY_RULES.env.keywords) ||
        matchCategoryFromText(title, CLASSIFY_RULES.env.keywords) ||
        '기타';

      if (it.__env === '기타' && title.indexOf('모바일') !== -1 && !hasIStartWord(title)) {
        it.__env = 'Android';
      }

      it.__feature = classifyFeatureBucket(title);
    });
  }

  function classifyFeatureBucket(title){
    var buckets = CLASSIFY_RULES.feature.buckets;
    for (var i = 0; i < buckets.length; i++){
      if (matchesKeywordList(title, buckets[i].keywords)) return buckets[i].label;
    }
    return '기타';
  }

  function aggregateGeneric(list, keyField, order){
    var map = {};
    list.forEach(function(it){
      var key = it[keyField] || '기타';
      if (!map[key]) map[key] = { label: key, progress: 0, done: 0, total: 0 };
      map[key].total++;
      if (isNotDoneStatus(it.상태)) map[key].progress++; else map[key].done++;
    });

    if (order){
      var known = order.filter(function(k){ return k !== '기타'; });
      var rows = known.map(function(k){
        return map[k] || { label: k, progress: 0, done: 0, total: 0 };
      });
      if (order.indexOf('기타') !== -1){
        var etc = { label: '기타', progress: 0, done: 0, total: 0 };
        Object.keys(map).forEach(function(k){
          if (known.indexOf(k) === -1){
            etc.progress += map[k].progress;
            etc.done += map[k].done;
            etc.total += map[k].total;
          }
        });
        rows.push(etc);
      }
      return rows;
    }

    var keys = Object.keys(map).filter(function(k){ return k !== '기타'; });
    keys.sort(function(a, b){ return map[b].total - map[a].total; });
    var rows2 = keys.map(function(k){ return map[k]; });
    if (map['기타']) rows2.push(map['기타']);
    return rows2;
  }

  async function loadData(squadId){
    var sel = document.getElementById('squadSelect');
    var squad = findSquad(squadId) || findSquad(state.squad);
    if (!squad){
      document.getElementById('errorBox').innerHTML =
        '<div class="error-box">스쿼드 목록이 비어 있습니다. index.html 상단의 SQUADS 배열을 확인해주세요.</div>';
      return;
    }

    state.squad = String(squad.id);
    saveSquad(state.squad);
    if (sel){ sel.value = state.squad; sel.disabled = true; }

    document.getElementById('errorBox').innerHTML = '';
    document.getElementById('lastUpdated').textContent = squad.label + ' 불러오는 중…';

    try {
      var res = await fetch('/api/issues?squad=' + encodeURIComponent(state.squad), { cache: 'no-store' });
      var data = await res.json();
      if (!data.ok) throw new Error(data.error || '알 수 없는 오류');

      if (String(state.squad) !== String(squad.id)) return;

      state.issues = data.issues || [];
      state.summary = data.summary;
      state.filter = null;
      state.sortDir = defaultSortDirFor(state.squad);
      updateSortHeader();
      document.getElementById('filterChip').classList.remove('active');
      classifyIssues(state.issues);

      var d = new Date(data.fetchedAt);
      state.today = isNaN(d) ? kstDateStr(new Date()) : kstDateStr(d);
      renderAll();

      document.getElementById('lastUpdated').innerHTML =
        escapeHtml(squad.label) + ' · 마지막 업데이트: <span>' + d.toLocaleString('ko-KR') + '</span> · 총 ' + (data.count != null ? data.count : state.issues.length) + '건';
    } catch (err) {
      document.getElementById('lastUpdated').textContent = '';
      document.getElementById('errorBox').innerHTML =
        '<div class="error-box">' + escapeHtml(squad.label) + ' 데이터를 불러오지 못했습니다: ' + escapeHtml(err.message || err) + '</div>';
    } finally {
      if (sel) sel.disabled = false;
    }
  }

  var TOOLTIP_PAD = 8;
  var TOOLTIP_GRACE = 160;
  var tooltipTracker = { el: null, anchor: null };

  function detachTooltip(el){
    if (el && el.parentNode !== document.body) document.body.appendChild(el);
  }

  function rectDistance(rect, x, y){
    var dx = Math.max(rect.left - x, 0, x - rect.right);
    var dy = Math.max(rect.top - y, 0, y - rect.bottom);
    return Math.sqrt(dx * dx + dy * dy);
  }

  function isTooltipVisible(el){
    return !!el && el.style.opacity !== '0' && el.style.opacity !== '';
  }

  function showTooltip(el, anchorRect){
    if (tooltipTracker.el && tooltipTracker.el !== el) hideTooltip(tooltipTracker.el);
    placeTooltip(el, anchorRect);
    el.style.pointerEvents = 'auto';
    tooltipTracker.el = el;
    tooltipTracker.anchor = {
      left: anchorRect.left, top: anchorRect.top,
      right: anchorRect.right, bottom: anchorRect.bottom
    };
  }

  function hideTooltip(el){
    if (!el) return;
    el.style.opacity = '0';
    el.style.pointerEvents = 'none';
    if (tooltipTracker.el === el){ tooltipTracker.el = null; tooltipTracker.anchor = null; }
  }

  document.addEventListener('mousemove', function(e){
    var el = tooltipTracker.el;
    if (!isTooltipVisible(el)) return;
    var dist = rectDistance(el.getBoundingClientRect(), e.clientX, e.clientY);
    if (tooltipTracker.anchor){
      dist = Math.min(dist, rectDistance(tooltipTracker.anchor, e.clientX, e.clientY));
    }
    if (dist > TOOLTIP_GRACE) hideTooltip(el);
  }, true);

  document.addEventListener('mousedown', function(e){
    var el = tooltipTracker.el;
    if (!isTooltipVisible(el)) return;
    if (!el.contains(e.target)) hideTooltip(el);
  }, true);

  function placeTooltip(el, anchorRect){
    el.style.opacity = '1';
    el.style.left = '0px';
    el.style.top = '0px';

    var w = el.offsetWidth;
    var h = el.offsetHeight;
    var vw = window.innerWidth;
    var vh = window.innerHeight;

    var left = anchorRect.left + anchorRect.width / 2 - w / 2;
    var top = anchorRect.top - h - 10;

    if (top < TOOLTIP_PAD) top = anchorRect.bottom + 10;
    if (top + h > vh - TOOLTIP_PAD) top = Math.max(TOOLTIP_PAD, vh - TOOLTIP_PAD - h);
    left = Math.min(Math.max(TOOLTIP_PAD, left), Math.max(TOOLTIP_PAD, vw - TOOLTIP_PAD - w));

    el.style.left = Math.round(left) + 'px';
    el.style.top = Math.round(top) + 'px';
  }

  var DAY_KIND_LABEL = { cumIssue: '누적 이슈', cumDone: '누적 해결', newCount: '이 날 신규', doneCount: '이 날 해결' };

  function chartTooltipHandler(context){
    var tooltipEl = document.getElementById('chartTooltip');
    if (!tooltipEl){
      tooltipEl = document.createElement('div');
      tooltipEl.id = 'chartTooltip';
      tooltipEl.className = 'chart-tooltip';
      document.body.appendChild(tooltipEl);
      tooltipEl.style.pointerEvents = 'none';
    }

    var tooltipModel = context.tooltip;
    if (!tooltipModel || tooltipModel.opacity === 0) return;

    var idx = (tooltipModel.dataPoints && tooltipModel.dataPoints.length) ? tooltipModel.dataPoints[0].dataIndex : null;
    if (idx === null) return;
    var day = state.summary.timeline[idx];
    if (!day) return;

    var rows = [
      { kind: 'cumIssue', value: day.cumIssue },
      { kind: 'cumDone', value: day.cumDone },
      { kind: 'newCount', value: day.newCount },
      { kind: 'doneCount', value: day.doneCount }
    ];

    var html = '<div class="chart-tooltip-title">' + escapeHtml(day.date) + '</div>';
    html += rows.map(function(r){
      return '<div class="chart-tooltip-row" data-day-kind="' + r.kind + '" data-day-date="' + escapeHtml(day.date) + '">' +
        '<span>' + DAY_KIND_LABEL[r.kind] + '</span><span class="chart-tooltip-value">' + (r.value != null ? r.value : 0) + '건</span></div>';
    }).join('');
    tooltipEl.innerHTML = html;

    var canvasRect = context.chart.canvas.getBoundingClientRect();
    var x = canvasRect.left + tooltipModel.caretX;
    var y = canvasRect.top + tooltipModel.caretY;
    showTooltip(tooltipEl, { left: x, top: y, right: x, bottom: y, width: 0, height: 0 });

    tooltipEl.querySelectorAll('.chart-tooltip-row').forEach(function(row){
      row.addEventListener('click', function(){
        setDayFilter(row.getAttribute('data-day-date'), row.getAttribute('data-day-kind'));
      });

    var el = document.getElementById('headerNotdoneCard');
    var valueEl = document.getElementById('headerNotdoneValue');
    if (!el || !valueEl) return;
    var f = state.filter;
    var isNotdoneActive = f && f.type === 'quick' && f.value === 'notdone';
    if (isNotdoneActive){
      el.firstChild.textContent = '전체 ';
      valueEl.textContent = state.issues.length;
    } else {
      el.firstChild.textContent = '미처리 ';
      valueEl.textContent = state.issues.filter(function(it){ return isNotDoneStatus(it.상태); }).length;
    }
  }

  function createdKey(it){
    return String((it && it.created_on) || '');
  }

  function sortIssueList(list){
    if (!state.sortDir) return list;
    var dir = state.sortDir === 'asc' ? 1 : -1;
    return list.slice().sort(function(a, b){
      var ka = createdKey(a), kb = createdKey(b);
      if (!ka && !kb) return 0;
      if (!ka) return 1;
      if (!kb) return -1;
      if (ka !== kb) return ka < kb ? -1 * dir : 1 * dir;
      var na = Number(a.일감번호) || 0, nb = Number(b.일감번호) || 0;
      return (na - nb) * dir;
    });
  }

  function updateSortHeader(){
    var th = document.getElementById('sortCreatedTh');
    var arrow = document.getElementById('sortCreatedArrow');
    if (!th || !arrow) return;
    if (state.sortDir === 'desc'){
      th.classList.add('active');
      arrow.innerHTML = '&#9660;';
      th.title = '작성시간 최신순 (클릭하면 오래된순)';
    } else if (state.sortDir === 'asc'){
      th.classList.add('active');
      arrow.innerHTML = '&#9650;';
      th.title = '작성시간 오래된순 (클릭하면 최신순)';
    } else {
      th.classList.remove('active');
      arrow.innerHTML = '&#8597;';
      th.title = '클릭하면 작성시간 최신순으로 정렬됩니다';
    }
  }

  function toggleCreatedSort(){
    state.sortDir = (state.sortDir === 'desc') ? 'asc' : 'desc';
    updateSortHeader();
    renderIssues();
    var scrollBox = document.getElementById('issuesTableScroll');
    if (scrollBox) scrollBox.scrollTop = 0;
  }

  (function initCreatedSortHeader(){
    var th = document.getElementById('sortCreatedTh');
    if (th) th.addEventListener('click', toggleCreatedSort);
    updateSortHeader();
  })();

  function renderIssues(){
    var list = state.issues;
    var f = state.filter;
    updateHeaderNotdoneButton();
    if (f){
      if (f.type === 'assignee'){
        list = list.filter(function(it){ return it.담당자 === f.value; });
      } else if (f.type === 'author'){
        list = list.filter(function(it){ return getAuthor(it) === f.value; });
      } else if (f.type === 'tracker'){
        list = list.filter(function(it){ return it.분류 === f.value; });
      } else if (f.type === 'status'){
        list = list.filter(function(it){ return (it.상태 || '').indexOf(f.value) !== -1; });
      } else if (f.type === 'priority'){
        list = list.filter(function(it){ return (it.우선순위 || '').indexOf(f.value) !== -1; });
      } else if (f.type === 'part'){
        list = list.filter(function(it){ return it.__part === f.value; });
      } else if (f.type === 'conntype'){
        list = list.filter(function(it){ return it.__connType === f.value; });
      } else if (f.type === 'feature'){
        list = list.filter(function(it){ return it.__feature === f.value; });
      } else if (f.type === 'env'){
        list = list.filter(function(it){ return it.__env === f.value; });
      } else if (f.type === 'day'){
        var issueDateStr = function(it){ return (it.created_on || '').split(' ')[0]; };
        if (f.kind === 'newCount'){
          list = list.filter(function(it){ return issueDateStr(it) === f.date; });
        } else if (f.kind === 'cumIssue'){
          list = list.filter(function(it){ return issueDateStr(it) && issueDateStr(it) <= f.date; });
        } else if (f.kind === 'doneCount'){
          list = list.filter(function(it){ return !isNotDoneStatus(it.상태) && issueDateStr(it) === f.date; });
        } else if (f.kind === 'cumDone'){
          list = list.filter(function(it){ return !isNotDoneStatus(it.상태) && issueDateStr(it) && issueDateStr(it) <= f.date; });
        }
      } else if (f.type === 'severity'){
        var tierObj = PRIORITY_TIERS.filter(function(t){ return t.label === f.tier; })[0];
        list = list.filter(function(it){
          var dateStr = (it.created_on || '').split(' ')[0];
          return dateStr === f.date && tierObj && tierObj.test(it.우선순위);
        });
      } else if (f.type === 'priorityTier'){
        if (f.tier === '경미함'){
          list = list.filter(function(it){ return isMinorPriority(it.우선순위) || isLowPriority(it.우선순위); });
        } else {
          var tierObj2 = PRIORITY_TIERS.filter(function(t){ return t.label === f.tier; })[0];
          list = list.filter(function(it){ return tierObj2 && tierObj2.test(it.우선순위); });
        }
      } else if (f.type === 'quick'){
        if (f.value === 'notdone') list = list.filter(function(it){ return isNotDoneStatus(it.상태); });
        else if (f.value === 'done') list = list.filter(function(it){ return !isNotDoneStatus(it.상태); });
        else if (f.value === 'notdone_high') list = list.filter(function(it){ return isNotDoneStatus(it.상태) && isHighPriority(it.우선순위); });
      }
    }

    document.getElementById('issueCount').textContent = list.length;

    list = sortIssueList(list);

    var rows = list.map(function(it, idx){
      var notDone = isNotDoneStatus(it.상태);
      return '<tr>' +
        '<td>' + (idx + 1) + '</td>' +
        '<td><a class="issue-link" href="' + escapeHtml(it.link) + '" target="_blank" rel="noopener">#' + escapeHtml(it.일감번호) + '</a></td>' +
        '<td>' + escapeHtml(it.분류) + '</td>' +
        '<td><span class="status-badge ' + (notDone ? 'notdone' : 'done') + '">' + escapeHtml(it.상태) + '</span></td>' +
        '<td class="title-cell">' +
          '<a class="title-link" href="' + escapeHtml(it.link) + '" target="_blank" rel="noopener">' + escapeHtml(it.제목) + '</a>' +
        '</td>' +
        '<td>' + escapeHtml(it.우선순위) + '</td>' +
        '<td>' + escapeHtml(it.담당자) + '</td>' +
        '<td>' + fmtTime(it.created_on) + '</td>' +
      '</tr>';
    }).join('');
    document.getElementById('issuesBody').innerHTML = rows || '<tr><td colspan="8" class="empty">해당 조건의 이슈가 없습니다</td></tr>';
  }

  document.getElementById('filterChip').addEventListener('click', function(){
    if (!state.filter) return;
    if (state.filter.type === 'day') {
      setDayFilter(state.filter.date, state.filter.kind);
    } else if (state.filter.type === 'severity') {
      setSeverityFilter(state.filter.date, state.filter.tier);
    } else if (state.filter.type === 'priorityTier') {
      setPriorityTierFilter(state.filter.tier);
    } else {
      setFilter(state.filter.type, state.filter.value);
    }
  });

  document.getElementById('hiddenNavBtn').addEventListener('click', function(){
    window.location.href = 'https://rc-version-check.vercel.app/';
  });

  (function initIssuesResizeHandle(){
    var handle = document.getElementById('expandIssuesBtn');
    var scrollBox = document.getElementById('issuesTableScroll');
    if (!handle || !scrollBox) return;

    var dragging = false;
    var startY = 0;
    var startHeight = 0;

    function currentHeight(){
      return scrollBox.getBoundingClientRect().height;
    }

    function clampHeight(h){
      var minH = 120;
      var maxH = window.innerHeight - scrollBox.getBoundingClientRect().top - 16;
      return Math.max(minH, Math.min(h, maxH));
    }

    function pointerY(e){
      return e.touches && e.touches.length ? e.touches[0].clientY : e.clientY;
    }

    function onPointerDown(e){
      dragging = true;
      startY = pointerY(e);
      startHeight = currentHeight();
      document.body.style.userSelect = 'none';
      e.preventDefault();
    }

    function onPointerMove(e){
      if (!dragging) return;
      var delta = pointerY(e) - startY;
      scrollBox.style.maxHeight = clampHeight(startHeight + delta) + 'px';
      e.preventDefault();
    }

    function onPointerUp(){
      if (!dragging) return;
      dragging = false;
      document.body.style.userSelect = '';
    }

    handle.addEventListener('mousedown', onPointerDown);
    handle.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('mousemove', onPointerMove, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('mouseup', onPointerUp);
    window.addEventListener('touchend', onPointerUp);

    window.addEventListener('resize', function(){
      scrollBox.style.maxHeight = '';
    });
  })();

  function hideAllTooltips(){
    ['assigneeTooltip', 'authorTooltip', 'chartTooltip'].forEach(function(id){
      hideTooltip(document.getElementById(id));
    });
  }
  window.addEventListener('scroll', hideAllTooltips, true);
  window.addEventListener('resize', hideAllTooltips);

  initSquadPicker();
  loadData(resolveInitialSquad());
</script>
