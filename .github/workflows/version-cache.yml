name: version-cache

# 베타 파트너 어드민 버전 정보를 주기적으로 받아 저장소에 스냅샷으로 커밋합니다.
# 커밋이 생기면 Vercel 이 자동 재배포되고, /api/builds 의 { type: 'file' } 경로가
# 새 스냅샷을 읽게 됩니다.

on:
  schedule:
    # 10분마다 (GitHub 예약 실행은 부하에 따라 수 분 지연될 수 있습니다)
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-cache
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 버전 정보 수집
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-version-cache.mjs

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain version/version-cache)" ]; then
            git add version/version-cache
            git commit -m "chore(version-cache): $(date -u +'%Y-%m-%dT%H:%M:%SZ') 갱신"
            git push
          else
            echo "변경 사항이 없어 커밋하지 않습니다."
          fi

      - name: 수집 실패 시 워크플로 실패 처리
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "버전 정보 수집에 실패했습니다. 위 로그를 확인하세요."
          exit 1
